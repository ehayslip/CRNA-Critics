<script>
  // Browsers only autoplay muted video. Start muted; unmute at the first tap so the sound comes on.
  var v = document.getElementById('v');
  v.muted = true;
  v.play().catch(function(){});
  function unmute(){ v.muted = false; if (v.paused) v.play().catch(function(){}); document.removeEventListener('touchstart', unmute); document.removeEventListener('click', unmute); }
  document.addEventListener('touchstart', unmute, { once: true });
  document.addEventListener('click', unmute, { once: true });
</script>
